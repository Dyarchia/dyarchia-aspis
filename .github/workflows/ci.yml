name: ci

on:
    pull_request:
        branches: [develop, master]

permissions:
    contents: read

jobs:
    check:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v5
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14
            - run: bun install --frozen-lockfile
            - run: bun run typecheck
            - run: bun run test
            - run: bun run --cwd apps/ui build
