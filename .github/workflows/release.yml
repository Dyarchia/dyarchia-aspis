name: release

on:
    push:
        branches: [master]

permissions:
    contents: read

jobs:
    installer:
        runs-on: windows-latest
        permissions:
            contents: write
        env:
            GH_TOKEN: ${{ github.token }}
        steps:
            - uses: actions/checkout@v5
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: apps/desktop/src-tauri
            - id: version
              shell: pwsh
              run: |
                  $version = (Get-Content package.json | ConvertFrom-Json).version
                  "tag=v$version" >> $env:GITHUB_OUTPUT
                  gh release view "v$version" *> $null
                  $exists = $LASTEXITCODE -eq 0
                  $global:LASTEXITCODE = 0
                  "exists=$($exists.ToString().ToLower())" >> $env:GITHUB_OUTPUT
            - if: steps.version.outputs.exists == 'false'
              run: bun install --frozen-lockfile
            - if: steps.version.outputs.exists == 'false'
              run: bun run release
            - if: steps.version.outputs.exists == 'false'
              shell: pwsh
              run: |
                  $installer = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
                  gh release create "${{ steps.version.outputs.tag }}" $installer.FullName --prerelease --target $env:GITHUB_SHA --title "${{ steps.version.outputs.tag }}" --generate-notes
