name: release

on:
    push:
        branches: [master]

permissions:
    contents: read

jobs:
    installer:
        runs-on: windows-latest
        permissions:
            contents: write
        env:
            GH_TOKEN: ${{ github.token }}
        steps:
            - uses: actions/checkout@v5
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: apps/desktop/src-tauri
            - id: version
              shell: pwsh
              run: |
                  $version = (Get-Content package.json | ConvertFrom-Json).version
                  "tag=v$version" >> $env:GITHUB_OUTPUT
                  gh release view "v$version" *> $null
                  $exists = $LASTEXITCODE -eq 0
                  $global:LASTEXITCODE = 0
                  "exists=$($exists.ToString().ToLower())" >> $env:GITHUB_OUTPUT
            - if: steps.version.outputs.exists == 'false'
              run: bun install --frozen-lockfile
            - if: steps.version.outputs.exists == 'false'
              run: bun run release
              env:
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
            - if: steps.version.outputs.exists == 'false'
              shell: pwsh
              run: |
                  $tag = "${{ steps.version.outputs.tag }}"
                  $version = $tag.Substring(1)
                  $built = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
                  $name = "Dyarchia-Aspis_${version}_x64-setup.exe"
                  Copy-Item $built.FullName $name
                  [ordered]@{
                      version = $version
                      notes = "https://github.com/${{ github.repository }}/releases/tag/$tag"
                      pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
                      platforms = @{
                          "windows-x86_64" = @{
                              signature = (Get-Content "$($built.FullName).sig" -Raw).Trim()
                              url = "https://github.com/${{ github.repository }}/releases/download/$tag/$name"
                          }
                      }
                  } | ConvertTo-Json -Depth 4 | Set-Content latest.json -Encoding utf8NoBOM
                  gh release create $tag $name latest.json --prerelease --target $env:GITHUB_SHA --title $tag --generate-notes
